<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="#FFFFFF"/>
  <g transform="translate(50, 50) scale(0.8)">
    <!-- 左侧结构化数据模型表示 -->
    <rect x="50" y="100" width="140" height="300" rx="10" fill="#F1F3F4" stroke="#4285F4" stroke-width="3"/>
    <rect x="70" y="130" width="100" height="20" rx="5" fill="#4285F4"/>
    <rect x="70" y="170" width="100" height="20" rx="5" fill="#4285F4"/>
    <rect x="70" y="210" width="100" height="20" rx="5" fill="#4285F4"/>
    <rect x="70" y="250" width="100" height="20" rx="5" fill="#4285F4"/>
    <rect x="70" y="290" width="100" height="20" rx="5" fill="#4285F4"/>
    <rect x="70" y="330" width="100" height="20" rx="5" fill="#4285F4"/>
    
    <!-- 右侧 FHIR 资源表示 -->
    <rect x="320" y="100" width="140" height="300" rx="10" fill="#F1F3F4" stroke="#34A853" stroke-width="3"/>
    <rect x="340" y="130" width="100" height="20" rx="5" fill="#34A853"/>
    <rect x="340" y="170" width="100" height="20" rx="5" fill="#34A853"/>
    <rect x="340" y="210" width="100" height="20" rx="5" fill="#34A853"/>
    <rect x="340" y="250" width="100" height="20" rx="5" fill="#34A853"/>
    <rect x="340" y="290" width="100" height="20" rx="5" fill="#34A853"/>
    <rect x="340" y="330" width="100" height="20" rx="5" fill="#34A853"/>
    
    <!-- 中间的映射/转换连接线 -->
    <path d="M 190 140 C 230 140, 280 140, 320 140" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M 190 180 C 230 180, 280 180, 320 180" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M 190 220 C 230 220, 280 220, 320 220" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M 190 260 C 230 260, 280 260, 320 260" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M 190 300 C 230 300, 280 300, 320 300" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <path d="M 190 340 C 230 340, 280 340, 320 340" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    
    <!-- 中间的医疗/健康标志 -->
    <circle cx="256" cy="80" r="30" fill="#FBBC05"/>
    <text x="256" y="90" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle" fill="#FFFFFF">+</text>
  </g>
